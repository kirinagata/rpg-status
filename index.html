<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RPG STATUS</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
console.log("Chart =", typeof Chart);
</script>
<style>/* プロフィール表示色 */

#profileName{
    color:#2b1b08;
    font-size:30px;
    font-weight:bold;
}

#profileJob{
    color:#58d8ff;
    font-weight:bold;
}

#profileGuild{
    color:#000000;
}

#profileLevel{
    color:#ffd700;
    font-weight:bold;
}

*{
    box-sizing:border-box;
}

body{
margin:0;
padding:20px;
min-height:100vh;
 
background:#000000;
 
color:#000000;
}

h1{
    text-align:center;
    color:#ffd700;

    font-size:clamp(
        36px,
        5vw,
        72px
    );

    letter-spacing:4px;
    margin-bottom:30px;

    text-shadow:
        0 0 10px gold,
        0 0 20px gold,
        0 0 40px gold;
}

.grid{
    display:grid;

    grid-template-columns:
        minmax(320px,30%)
        minmax(500px,1fr);

    gap:20px;
}

.panel{
    position:relative;

    padding:20px;

    border-radius:18px;

    background:
        linear-gradient(
            180deg,
            180deg,
rgba(60,100,160,.92),
rgba(35,65,120,.92)
        );

    border:3px solid #d4af37;

    box-shadow:
        0 0 15px rgba(212,175,55,.5),
        inset 0 0 20px rgba(255,255,255,.15);
}

.panel::before{
    content:"";

    position:absolute;

    inset:6px;

    border:1px solid rgba(255,215,0,.35);

    border-radius:12px;

    pointer-events:none;
}

h2{
    color:#ffe28a;
    margin-top:0;
}

/* ===== プロフィール ===== */

.profileCard{
    display:flex;
    align-items:center;
    gap:20px;

    margin-bottom:20px;
    padding:15px;

    border-radius:15px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.10),
            rgba(255,255,255,.03)
        );

    border:1px solid rgba(255,215,0,.3);
}

.avatar{
    width:120px;
    height:120px;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:60px;

    border-radius:50%;

    border:3px solid gold;

    background:
        radial-gradient(
            circle,
            #284f87,
            #102038
        );

    box-shadow:
        0 0 20px gold,
        inset 0 0 20px rgba(255,255,255,.15);
}

#profileName{
    color:#0b1f3a;
    font-size:30px;
    font-weight:bold;
}

#profileJob{
    color:#004e92;
    font-weight:bold;
}

#profileGuild{
    color:#16324f;
}

#profileLevel{
    color:#a66a00;
    font-weight:bold;
}


/* ===== 入力 ===== */

.row{
    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:10px;
    margin-bottom:12px;
}

label{
    color:#16324f;
    font-weight:bold;
}

input,
select{color:#000000;
width:120px;
 
padding:8px;
 
border:2px solid #4fa3ff;
border-radius:8px;
 
background:#ffffff;
color:#000000;
 
font-weight:bold;

label{
color:#000000;
font-weight:bold;
}

/* ===== ボタン ===== */

button{
    width:100%;

    padding:12px;
    margin-top:15px;

    border:none;
    border-radius:10px;

    cursor:pointer;

    color:white;
    font-weight:bold;

    background:#000000;
        linear-gradient(
            90deg,
            #1b70ff,
            #48a1ff
        );

    box-shadow:
        0 0 15px rgba(0,150,255,.35);
}

button:hover{
    filter:brightness(1.1);
}

/* ===== チャート ===== */

.chartContainer{
    width:min(95vw,850px);
    height:min(95vw,850px);

    margin:10px auto;
}

#radarChart{
    border-radius:20px;

    background:
        radial-gradient(
            circle,
            rgba(255,215,0,.06),
            rgba(0,0,0,0)
        );
}

/* ===== ランク ===== */

.rank{
    text-align:center;

    font-size:clamp(
        70px,
        10vw,
        140px
    );

    color:#ffd700;

    margin:15px 0;

    text-shadow:
        0 0 10px gold,
        0 0 20px gold,
        0 0 40px gold;
}

/* ===== メッセージ ===== */

.message,
.jobDescription{
    margin-top:15px;

    padding:15px;

    border-radius:10px;

    line-height:1.8;
}

.message{
    background:rgba(0,150,255,.08);

    border:
        1px solid rgba(75,212,255,.35);
}

.jobDescription{
    background:rgba(255,215,0,.08);

    border:
        1px solid rgba(255,215,0,.25);
}

/* ===== ステータスバー ===== */

.statusRow{
    margin-bottom:14px;
}

.statusLabel{
    margin-bottom:4px;

    color:#16324f;
    font-weight:bold;
}

.bar{
    width:100%;
    height:18px;

    overflow:hidden;

    border-radius:20px;

    background:#15243c;

    border:
        1px solid rgba(255,215,0,.3);
}

.fill{
    height:100%;

    background:
        linear-gradient(
            90deg,
            #38b6ff,
            #63f5ff
        );
}

.score{
    margin-top:4px;

    text-align:right;

    color:#ffffff;

    font-size:14px;
}

/* ===== スマホ対応 ===== */

@media(max-width:1000px){

    .grid{
        grid-template-columns:1fr;
    }

    .chartContainer{
        width:min(90vw,500px);
        height:min(90vw,500px);
    }

    .profileCard{
        flex-direction:column;
        text-align:center;
    }
}

@media(max-width:600px){

    body{
        padding:10px;
    }

    .avatar{
        width:90px;
        height:90px;
        font-size:48px;
    }

    #profileName{
        font-size:24px;
    }

    input,
    select{
        width:110px;
    }
} 

</style>

</head>

<body>

<div class="container">

<h1>ADVENTURER STATUS</h1>

<div class="grid">

<!-- 左側 -->

<div class="panel">

<h2>プロフィール設定</h2>

<div class="row">
<label>名前</label>
<input id="name" value="プレイヤー">
</div>

<div class="row">
<label>所属</label>
<input id="guild" value="未所属">
</div>

<div class="row">
<label>レベル</label>
<input id="level" type="number" value="1">
</div>

<div class="row">
<label>ジョブ</label>
<select id="job">

<option>剣士</option>
<option>白魔術師</option>
<option>学者</option>
<option>錬金術師</option>
<option>踊り子</option>
<option>忍者</option>
<option>商人</option>
<option>魔物使い</option>

</select>
</div>

<hr>

<h2>能力値</h2>

<div class="row">
<label>体力</label>
<input id="physical" type="number" min="1" max="5" value="4">
</div>

<div class="row">
<label>移動力</label>
<input id="move" type="number" min="1" max="5" value="4">
</div>

<div class="row">
<label>情報収集力</label>
<input id="research" type="number" min="1" max="5" value="4">
</div>

<div class="row">
<label>計画力</label>
<input id="planning" type="number" min="1" max="5" value="4">
</div>

<div class="row">
<label>相談・依頼力</label>
<input id="request" type="number" min="1" max="5" value="4">
</div>

<div class="row">
<label>仲間づくり力</label>
<input id="teamwork" type="number" min="1" max="5" value="4">
</div>

<div class="row">
<label>自己決定力</label>
<input id="decision" type="number" min="1" max="5" value="4">
</div>

<button onclick="updateStatus()">
ステータス更新
</button>

</div>

<!-- 右側 -->

<div class="panel">

<div class="profileCard">

<div class="avatar" id="avatar">
⚔️
</div>

<div>

<h2 id="profileName">
プレイヤー
</h2>

<p>
JOB :
<span id="profileJob">剣士</span>
</p>

<p>
GUILD :
<span id="profileGuild">未所属</span>
</p>

<p>
LEVEL :
<span id="profileLevel">1</span>
</p>

</div>

</div>

<div class="chartContainer">
<canvas id="radarChart"></canvas>
</div>

<div class="rank" id="rank">
A
</div>

<div class="message" id="message">
バランスの良い成長型ステータスです。
</div>

<div class="jobDescription" id="jobDescription">
体力と自己決定力に優れた前衛型ジョブ。
</div>

<h2>ステータス詳細</h2>

<div id="bars"></div>

</div>

</div>

</div>

<script>

const labels = [
    "体力",
    "移動力",
    "情報収集力",
    "計画力",
    "相談・依頼力",
    "仲間づくり力",
    "自己決定力"
];

const avatars = {
    "剣士":"⚔️",
    "白魔術師":"✨",
    "学者":"📚",
    "錬金術師":"⚗️",
    "踊り子":"💃",
    "忍者":"🥷",
    "商人":"💰",
    "魔物使い":"🐉"
};

const jobData = {
    "剣士":"体力と自己決定力に優れた前衛型ジョブ。",
    "白魔術師":"相談・依頼力と仲間づくり力で仲間を支える支援型ジョブ。",
    "学者":"情報収集力と計画力に優れた知識探究型ジョブ。",
    "錬金術師":"創意工夫と挑戦によって新たな価値を生み出すジョブ。",
    "踊り子":"交流力と仲間づくり力を活かすムードメーカー。",
    "忍者":"移動力と自己決定力に優れた機動型ジョブ。",
    "商人":"相談・依頼力と人脈形成を得意とする交渉型ジョブ。",
    "魔物使い":"仲間の力を引き出し全体を導く統率型ジョブ。"
};

function getLabelSize(){

    if(window.innerWidth < 500){
        return 15;
    }

    if(window.innerWidth < 900){
        return 17;
    }

    return 19;
}

function getRank(avg){

    if(avg >= 4.8) return "SS";
    if(avg >= 4.3) return "S";
    if(avg >= 3.8) return "A";
    if(avg >= 3.0) return "B";
    if(avg >= 2.0) return "C";

    return "D";
}

function getMessage(avg){

    if(avg >= 4.8){
        return "伝説級の能力値です。あらゆる場面で活躍できるステータスを備えています。";
    }

    if(avg >= 4.3){
        return "非常に優秀な冒険者です。チームを牽引する資質があります。";
    }

    if(avg >= 3.8){
        return "バランスの良い成長型ステータスです。";
    }

    if(avg >= 3.0){
        return "今後の成長余地が大きい状態です。";
    }

    if(avg >= 2.0){
        return "経験を積みながら能力を伸ばしていきましょう。";
    }

    return "基礎能力の向上に挑戦しましょう。";
}

function renderBars(values){

    let html = "";

    labels.forEach((label,index)=>{

        html += `
        <div class="statusRow">

            <div class="statusLabel">
                ${label}
            </div>

            <div class="bar">
                <div
                    class="fill"
                    style="width:${values[index] * 20}%">
                </div>
            </div>

            <div class="score">
                ${values[index]} / 5
            </div>

        </div>
        `;

    });

    document.getElementById("bars").innerHTML = html;
}

const chart = new Chart(
    document.getElementById("radarChart"),
    {
        type:"radar",

        data:{
            labels:labels,

            datasets:[{

                label:"STATUS",

                data:[4,4,4,4,4,4,4],

                backgroundColor:"rgba(0,180,255,.30)",

                borderColor:"#47d7ff",

                borderWidth:4,

                pointBackgroundColor:"#47d7ff",

                pointBorderColor:"#47d7ff",

                pointRadius:6,

                pointHoverRadius:8

            }]
        },

        options:{

            responsive:true,

            maintainAspectRatio:false,

            plugins:{
                legend:{
                    display:false
                }
            },

            animation:{
                duration:1200
            },

            scales:{
                r:{

                    min:0,
                    max:5,

                    ticks:{
stepSize:1,
color:"#FFFFFF",
backdropColor:"transparent"
},
 
pointLabels:{
color:"#000000",
padding:15,
font:{
size:getLabelSize(),
weight:"bold"
    }
}
                }
            }
        }
    }
);

function updateStatus(){

    const values = [

        Number(document.getElementById("physical").value),
        Number(document.getElementById("move").value),
        Number(document.getElementById("research").value),
        Number(document.getElementById("planning").value),
        Number(document.getElementById("request").value),
        Number(document.getElementById("teamwork").value),
        Number(document.getElementById("decision").value)

    ];

    chart.data.datasets[0].data = values;
    chart.update();

    const avg =
        values.reduce((a,b)=>a+b,0)
        / values.length;

    const selectedJob =
        document.getElementById("job").value;

    document.getElementById("rank").textContent =
        getRank(avg);

    document.getElementById("message").textContent =
        getMessage(avg);

    document.getElementById("jobDescription").textContent =
        jobData[selectedJob];

    document.getElementById("avatar").textContent =
        avatars[selectedJob];

    document.getElementById("profileName").textContent =
        document.getElementById("name").value;

    document.getElementById("profileJob").textContent =
        selectedJob;

    document.getElementById("profileGuild").textContent =
        document.getElementById("guild").value;

    document.getElementById("profileLevel").textContent =
        document.getElementById("level").value;

    renderBars(values);
}

window.addEventListener("resize",()=>{

    chart.options.scales.r.pointLabels.font.size =
        getLabelSize();

    chart.update();

});

updateStatus();

</script>

</body>
</html>
